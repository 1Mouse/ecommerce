services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      JWT_ACCESS_TOKEN_SECRET: dev-access-token-secret-change-me-123456
      JWT_ACCESS_TOKEN_EXPIRES_IN_SECONDS: 900
      JWT_REFRESH_TOKEN_EXPIRES_IN_SECONDS: 2592000
      EMAIL_VERIFICATION_EXPIRES_IN_SECONDS: 86400
      EMAIL_VERIFICATION_URL: http://localhost:5173/verify-email
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Ecommerce <no-reply@ecommerce.local>
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ecommerce-local
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: true
      PASSWORD_HASH_ROUNDS: 12
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - mailpit
      - minio

  mongo:
    image: docker.io/library/mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: docker.io/axllent/mailpit:v1.30
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:
